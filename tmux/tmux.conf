##### Reload config #####
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### Basic settings #####
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 10        # snappy <Esc> in nvim
set -g focus-events on       # lets nvim autoread on focus
set -g set-clipboard on      # OSC 52 clipboard (WSL / DevPod)
set -g history-limit 50000

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g automatic-rename off
set -g allow-rename off

##### Prefix #####
# set -g prefix C-s
# unbind C-b
# bind C-s send-prefix

set -g mouse on
set -g mode-keys vi

##### Pane navigation (vim-like) #####
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Rename window to current directory name
bind-key R run-shell 'tmux rename-window "$(basename "#{pane_current_path}")"'

##### Status bar base #####
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 150

##### Pane styling #####
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour208,bold'
set -g window-style 'fg=colour247'
set -g window-active-style 'fg=colour250'

##### Plugins (TPM) — prefix + I to install, prefix + U to update #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'TanglingTreats/tmux-everforest'

##### Theme #####
set -g @tmux-everforest 'dark-medium'

##### IMPORTANT: TPM must be last #####
run '~/.tmux/plugins/tpm/tpm'
